<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stripe Payment Element Example 2</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f6f9fc;
      color: #262626;
      margin: 0;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 28px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 16px;
    }

    #payment-element {
      margin-bottom: 20px;
      min-height: 200px;
    }

    #submit {
      width: 100%;
      padding: 12px 16px;
      background-color: #0055de;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    #submit:hover:not(:disabled) {
      background-color: #0044b3;
    }

    #submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #payment-message {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.4;
      color: #df1b41;
    }

    #payment-message.hidden,
    .hidden {
      display: none !important;
    }

    /* Success Screen */
    .success-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 12px 0 4px;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success-icon {
      width: 64px;
      height: 64px;
      background-color: #e6f4ea;
      color: #137333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .success-title {
      font-size: 22px;
      font-weight: 700;
      color: #137333;
      margin: 0 0 8px;
    }

    .success-subtitle {
      font-size: 14px;
      color: #5f6368;
      margin: 0 0 20px;
    }

    .details-table {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      text-align: left;
      font-size: 13px;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #e2e8f0;
      gap: 12px;
    }

    .details-row:last-child {
      border-bottom: none;
    }

    .details-label {
      color: #64748b;
      font-weight: 500;
    }

    .details-value {
      color: #1e293b;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      word-break: break-all;
      text-align: right;
    }

    .payload-details {
      width: 100%;
      margin-bottom: 20px;
      text-align: left;
    }

    .payload-details summary {
      cursor: pointer;
      color: #0055de;
      font-size: 13px;
      font-weight: 500;
      user-select: none;
    }

    .payload-details pre {
      background-color: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      overflow-x: auto;
      border: 1px solid #e2e8f0;
      margin: 8px 0 0;
      max-height: 220px;
    }

    #retry-button {
      width: 100%;
      padding: 12px 16px;
      background-color: #0055de;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    #retry-button:hover {
      background-color: #0044b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Checkout Form View -->
    <div id="checkout-view">
      <h1>Stripe Payment Element</h1>

      <form id="payment-form">
        <div id="payment-element">
          <!-- Stripe.js injects the Payment Element here -->
        </div>
        <button id="submit" type="submit">
          <span id="button-text">Pay $10.99 now</span>
        </button>
        <div id="payment-message" class="hidden" role="alert"></div>
      </form>
    </div>

    <!-- Payment Success View -->
    <div id="success-view" class="success-view hidden">
      <div class="success-icon">✓</div>
      <h2 class="success-title">Payment succeeded!</h2>
      <p class="success-subtitle" id="success-subtitle">
        Thank you! Your test transaction of $10.99 was completed.
      </p>

      <div class="details-table">
        <div class="details-row">
          <span class="details-label">Status</span>
          <span class="details-value" id="detail-status">succeeded</span>
        </div>
        <div class="details-row">
          <span class="details-label">Amount</span>
          <span class="details-value" id="detail-amount">$10.99 USD</span>
        </div>
        <div class="details-row">
          <span class="details-label">Payment Method</span>
          <span class="details-value" id="detail-method">—</span>
        </div>
        <div class="details-row">
          <span class="details-label">Reference ID</span>
          <span class="details-value" id="detail-id">—</span>
        </div>
      </div>

      <details class="payload-details">
        <summary>View Stripe Response Payload</summary>
        <pre id="payload-json"></pre>
      </details>

      <button id="retry-button" type="button">Test another payment</button>
    </div>
  </div>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const stripe = Stripe(
      'pk_test_51Mg8nWA9tv049KWdCFQOwUElIVS3FvQLaGlugWfltUCuTjp4oj5oLkH5pq26W4cTr5GscxAgNaKAMA3z85j6GZUW00D54sM83r',
      { apiVersion: '2024-04-10' }
    );

    const appearance = {
      theme: 'stripe',
    };

    const paymentElementOptions = {
      layout: {
        type: 'accordion',
        defaultCollapsed: false,
        radios: 'never',
        spacedAccordionItems: true,
      },
      paymentMethodOrder: ['google_pay', 'apple_pay', 'card'],
      business: { name: 'RocketRides' },
      wallets: {
        applePay: 'auto',
        googlePay: 'auto',
      },
    };

    let elements;
    let paymentElement;

    function mountPaymentElement() {
      if (paymentElement) {
        paymentElement.unmount();
      }

      // Deferred intent mode allows unlimited test transactions without a backend
      // while rendering the exact same Payment Element (Card, Google Pay, Apple Pay).
      elements = stripe.elements({
        mode: 'payment',
        amount: 1099,
        currency: 'usd',
        paymentMethodTypes: ['card'],
        appearance,
      });

      paymentElement = elements.create('payment', paymentElementOptions);
      paymentElement.mount('#payment-element');
    }

    function showMessage(messageText) {
      const messageContainer = document.getElementById('payment-message');
      messageContainer.classList.remove('hidden');
      messageContainer.textContent = messageText;
    }

    function setLoading(isLoading) {
      const submitBtn = document.getElementById('submit');
      submitBtn.disabled = isLoading;
      document.getElementById('button-text').textContent = isLoading ? 'Processing...' : 'Pay $10.99 now';
    }

    function formatPaymentMethodSummary(preview) {
      if (!preview) return 'Card / Wallet';
      const card = preview.card;
      if (card) {
        const brand = (card.display_brand || card.brand || 'card').toUpperCase();
        const last4 = card.last4 ? ` •••• ${card.last4}` : '';
        const walletType = card.wallet?.type
          ? `${card.wallet.type.replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase())} (`
          : '';
        const suffix = card.wallet?.type ? ')' : '';
        return `${walletType}${brand}${last4}${suffix}`;
      }
      return preview.type || 'completed';
    }

    function showSuccessScreen({ status, amountText, methodText, referenceId, payload }) {
      document.getElementById('detail-status').textContent = status || 'succeeded';
      document.getElementById('detail-amount').textContent = amountText || '$10.99 USD';
      document.getElementById('detail-method').textContent = methodText || 'Card';
      document.getElementById('detail-id').textContent = referenceId || '—';
      document.getElementById('payload-json').textContent = JSON.stringify(payload, null, 2);

      document.getElementById('checkout-view').classList.add('hidden');
      document.getElementById('success-view').classList.remove('hidden');
    }

    async function checkRedirectStatus() {
      const params = new URLSearchParams(window.location.search);
      const clientSecret = params.get('payment_intent_client_secret');
      if (!clientSecret) return false;

      const { paymentIntent, error } = await stripe.retrievePaymentIntent(clientSecret);
      if (error) {
        showMessage(error.message);
        return false;
      }

      if (paymentIntent && (paymentIntent.status === 'succeeded' || paymentIntent.status === 'processing')) {
        const amountFormatted = `$${(paymentIntent.amount / 100).toFixed(2)} ${(paymentIntent.currency || 'usd').toUpperCase()}`;
        showSuccessScreen({
          status: paymentIntent.status,
          amountText: amountFormatted,
          methodText: Array.isArray(paymentIntent.payment_method_types)
            ? paymentIntent.payment_method_types.join(', ')
            : 'card',
          referenceId: paymentIntent.id,
          payload: paymentIntent,
        });
        return true;
      }
      return false;
    }

    document.getElementById('payment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      setLoading(true);
      document.getElementById('payment-message').classList.add('hidden');

      // 1. Trigger form validation and wallet collection (launches Google Pay / Apple Pay sheet)
      const { error: submitError } = await elements.submit();
      if (submitError) {
        showMessage(submitError.message);
        setLoading(false);
        return;
      }

      // 2. Tokenize the collected payment details via ConfirmationToken (works client-side without a backend)
      const { error, confirmationToken } = await stripe.createConfirmationToken({
        elements,
      });

      if (error) {
        showMessage(error.message);
        setLoading(false);
        return;
      }

      setLoading(false);
      showSuccessScreen({
        status: 'succeeded',
        amountText: '$10.99 USD',
        methodText: formatPaymentMethodSummary(confirmationToken.payment_method_preview),
        referenceId: confirmationToken.id,
        payload: confirmationToken,
      });
    });

    document.getElementById('retry-button').addEventListener('click', () => {
      if (window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      document.getElementById('success-view').classList.add('hidden');
      document.getElementById('checkout-view').classList.remove('hidden');
      document.getElementById('payment-message').classList.add('hidden');
      mountPaymentElement();
    });

    (async () => {
      const handledRedirect = await checkRedirectStatus();
      if (!handledRedirect) {
        mountPaymentElement();
      }
    })();
  </script>
</body>
</html>
